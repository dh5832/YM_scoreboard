<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="dark">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <title>YM 점수 기록표</title>
    <style>
        :root {
            --bg: #121212;
            --panel: #1e1e1e;
            --panel-2: #242424;
            --head: #2a2a2a;
            --border: #333;
            --text: #e0e0e0;
            --muted: #999;
            --red: #ff6b6b;
            --blue: #4dabf7;
            --green: #51cf66;
            --gold: #f1c40f;
            --danger: #ff4d4d;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            padding: 15px;
        }

        button, input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .page {
            max-width: 1400px;
            margin: 0 auto;
            padding-bottom: 50px;
        }

        .hidden { display: none !important; }

        .header-area,
        .header-bottom,
        .history-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .header-area {
            margin-bottom: 20px;
        }

        h1, h2, h3, p { margin-top: 0; }

        h2 {
            margin-bottom: 0;
            color: #fff;
            font-size: 24px;
        }

        h3 {
            margin-bottom: 0;
            color: var(--gold);
        }

        .header-actions,
        .toolbar-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .btn {
            border: 0;
            border-radius: 6px;
            padding: 9px 13px;
            font-size: 14px;
            font-weight: 800;
            color: #fff;
            background: #4a4a4a;
            transition: filter .15s ease, transform .15s ease;
            white-space: nowrap;
        }

        .btn:hover { filter: brightness(1.12); }
        .btn:active { transform: translateY(1px); }

        .btn-gold {
            background: var(--gold);
            color: #121212;
        }

        .btn-danger {
            background: #ff3b30;
            color: #fff;
        }

        .btn-danger-soft {
            background: var(--danger);
            color: #fff;
        }

        .btn-muted {
            background: #555;
            color: #fff;
        }

        .controls {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            min-width: 0;
            flex: 1;
            padding: 12px;
            font-size: 16px;
            background: #2c2c2c;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
        }

        input[type="text"]::placeholder { color: #888; }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            background: var(--panel);
        }

        #scoreTable { min-width: 900px; }

        .main-score-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(620px, 1fr));
            gap: 24px;
            margin-bottom: 20px;
            width: 100%;
        }

        .main-score-card {
            background: #181818;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 14px;
        }

        .main-score-title {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(241, 196, 15, 0.15);
            color: var(--gold);
            font-weight: 900;
            font-size: 15px;
        }

        .main-score-table {
            width: 100%;
            min-width: 620px;
            table-layout: fixed;
        }

        .main-score-table th:first-child,
        .main-score-table td:first-child {
            width: 18%;
            text-align: left;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 12px 6px;
        }

        th {
            background: var(--head);
            white-space: nowrap;
        }

        .team-red { color: var(--red); font-weight: 800; }
        .team-blue { color: var(--blue); font-weight: 800; }
        .team-green { color: var(--green); font-weight: 800; }

        .score-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .score-val {
            min-width: 38px;
            font-weight: 800;
            font-size: 16px;
            color: #fff;
        }

        .arrow-btn {
            border: 1px solid #555;
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 12px;
            background: #3a3a3a;
            color: var(--text);
        }

        .category-cell {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            min-width: 120px;
            padding-left: 5px;
            text-align: left;
        }

        .category-name {
            font-weight: 800;
            word-break: keep-all;
        }

        .delete-btn {
            border: 0;
            border-radius: 4px;
            padding: 6px 8px;
            font-size: 11px;
            background: var(--danger);
            color: #fff;
            flex-shrink: 0;
        }

        .total-row {
            background: var(--head);
            font-weight: 900;
            font-size: 18px;
            color: #fff;
        }

        .total-row td { padding: 15px 6px; }

        .team-reset-row {
            background: #222;
            color: #aaa;
            font-size: 14px;
        }

        .team-reset-row td { padding: 8px 6px; }

        .col-reset-btn {
            width: 80%;
            max-width: 90px;
            border: 0;
            border-radius: 4px;
            padding: 6px 8px;
            font-size: 12px;
            background: #555;
            color: #fff;
        }

        .header-bottom {
            margin-top: 40px;
            margin-bottom: 15px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        #indTable {
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .ind-header { color: var(--gold); }

        .notice {
            margin-top: 18px;
            padding: 12px 14px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #1b1b1b;
            color: #aaa;
            font-size: 12px;
            line-height: 1.6;
        }

        /* History */
        #historyView.page {
            max-width: 1500px;
        }

        .history-topbar {
            margin-bottom: 10px;
        }

        .history-desc {
            color: #aaa;
            line-height: 1.6;
            margin-bottom: 18px;
        }

        .history-toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 14px;
            margin-bottom: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--panel);
        }

        .selection-info {
            flex: 1 1 170px;
            min-width: 150px;
            color: #fff;
            font-weight: 900;
        }

        .history-card {
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--panel);
        }

        .history-card.selected {
            border-color: var(--gold);
            box-shadow: 0 0 0 1px var(--gold) inset;
        }

        .history-card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--panel-2);
        }

        .history-check-label {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            color: #fff;
            font-weight: 900;
            cursor: pointer;
        }

        .history-check-label input {
            width: 20px;
            height: 20px;
            accent-color: var(--gold);
            flex: 0 0 auto;
        }

        .history-card-body {
            padding: 14px 16px 18px;
        }

        .section-label {
            margin-bottom: 10px;
            color: var(--gold);
            font-weight: 900;
            font-size: 15px;
        }

        .score-report-wrap {
            min-width: 900px;
        }

        .rank-strip {
            display: grid;
            grid-template-columns: 17% repeat(6, 1fr);
            width: 100%;
            align-items: end;
            margin-bottom: 5px;
        }

        .rank-strip-spacer,
        .rank-strip-cell {
            min-height: 48px;
        }

        .rank-strip-cell {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .rank-icon {
            display: block;
            font-size: 38px;
            line-height: 1;
            filter: drop-shadow(0 0 6px rgba(255,255,255,.15));
        }

        .rank-icon.empty {
            visibility: hidden;
        }

        .history-score-table {
            min-width: 900px;
            table-layout: fixed;
        }

        .history-score-table th:first-child,
        .history-score-table td:first-child {
            width: 17%;
            text-align: left;
            font-weight: 800;
        }

        .team-name {
            font-size: 14px;
            font-weight: 900;
        }

        /* Bootstrap 기반 최종점수 강조 */
        .final-score-row td {
            background-color: rgba(255, 193, 7, .18) !important;
            border-top: 4px solid var(--bs-warning) !important;
            border-bottom: 4px solid var(--bs-warning) !important;
            padding-top: 16px !important;
            padding-bottom: 16px !important;
            vertical-align: middle !important;
        }

        .final-score-label {
            font-weight: 800 !important;
            font-size: 40px !important;
            line-height: 1.05 !important;
            letter-spacing: normal !important;
            white-space: nowrap;
            background: transparent !important;
            color: inherit !important;
            padding: 0 !important;
            border: 0 !important;
            border-radius: 0 !important;
            box-shadow: none !important;
        }

        .final-score-chip {
            min-width: 86px;
            font-size: 1.65rem !important;
            line-height: 1;
            background: #171717 !important;
            border-width: 2px !important;
        }

        .final-score-row td.team-red .final-score-chip {
            color: var(--red) !important;
            border-color: rgba(255,107,107,.75) !important;
        }

        .final-score-row td.team-blue .final-score-chip {
            color: var(--blue) !important;
            border-color: rgba(77,171,247,.75) !important;
        }

        .final-score-row td.team-green .final-score-chip {
            color: var(--green) !important;
            border-color: rgba(81,207,102,.75) !important;
        }

        .empty-history {
            padding: 28px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--panel);
            color: #999;
            text-align: center;
        }

        /* Save / JPG Preview */
        #printView {
            max-width: 1500px;
            padding: 0;
            margin: 0 auto;
        }

        .print-toolbar {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid #333;
            background: #1e1e1e;
            margin-bottom: 14px;
        }

        .print-toolbar strong {
            color: #fff;
        }

        .print-pages {
            display: flex;
            flex-direction: column;
            gap: 18px;
            background: transparent;
        }

        .print-record {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            overflow: hidden;
        }

        .print-date {
            display: inline-block;
            align-self: flex-start;
            margin-bottom: 10px;
            padding: 8px 12px;
            border-left: 6px solid var(--gold);
            border-radius: 7px;
            background: #242424;
            color: #fff;
            font-size: 16px;
            font-weight: 900;
        }

        .print-record .section-label {
            margin-bottom: 10px;
            font-size: 15px;
        }

        .record-group-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(640px, 1fr));
            gap: 24px;
            width: 100%;
        }

        .record-group-card {
            background: #191919;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 12px;
            overflow: hidden;
        }

        .record-group-title {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(241, 196, 15, 0.15);
            color: var(--gold);
            font-weight: 900;
            font-size: 15px;
        }

        .group-report-wrap {
            min-width: 0;
        }

        .group-rank-strip {
            display: grid;
            grid-template-columns: 24% repeat(3, 1fr);
            width: 100%;
            align-items: end;
            margin-bottom: 4px;
        }

        .group-rank-strip-spacer,
        .group-rank-strip-cell {
            min-height: 42px;
        }

        .group-rank-strip-cell {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .group-rank-icon {
            display: block;
            font-size: 34px;
            line-height: 1;
            filter: drop-shadow(0 0 6px rgba(255,255,255,.15));
        }

        .group-rank-icon.empty {
            visibility: hidden;
        }

        .group-score-table {
            width: 100%;
            table-layout: fixed;
            min-width: 620px;
        }

        .group-score-table th:first-child,
        .group-score-table td:first-child {
            width: 24%;
            text-align: left;
            font-weight: 800;
        }

        .group-score-table .team-name {
            font-size: 14px;
            font-weight: 900;
        }

        .print-record .group-score-table th,
        .print-record .group-score-table td {
            padding: 10px 6px;
        }

        .print-record .final-score-label {
            font-weight: 800 !important;
            font-size: 40px !important;
            line-height: 1.05 !important;
            letter-spacing: normal !important;
            white-space: nowrap;
            background: transparent !important;
            color: inherit !important;
            padding: 0 !important;
            border: 0 !important;
            border-radius: 0 !important;
            box-shadow: none !important;
        }

        .print-record .final-score-chip {
            min-width: 74px;
            font-size: 1.35rem !important;
            line-height: 1;
            background: #171717 !important;
            border-width: 2px !important;
        }
        .print-empty {
            max-width: 720px;
            margin: 40px auto;
            padding: 28px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #1e1e1e;
            color: #aaa;
            text-align: center;
            line-height: 1.7;
        }

        @media (max-width: 900px) {
            body { padding: 10px; }

            .header-area,
            .header-bottom,
            .history-topbar,
            .print-toolbar {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            .header-actions,
            .toolbar-actions {
                justify-content: stretch;
            }

            .header-actions .btn,
            .toolbar-actions .btn {
                flex: 1 1 auto;
            }

            .controls {
                flex-direction: column;
            }

            .history-toolbar {
                align-items: stretch;
            }

            .selection-info {
                flex-basis: 100%;
            }

            .record-group-grid,
            .main-score-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
    <main id="mainView" class="page">
        <div class="header-area">
            <h2>🎯 팀별 점수 기록표</h2>
            <div class="header-actions">
                <button class="btn btn-gold" id="openHistoryBtn">🗂️ 이전 게임 기록 보기</button>
                <button class="btn btn-danger" id="newGameBtn">전체 초기화</button>
            </div>
        </div>

        <div class="controls">
            <input type="text" id="categoryInput" placeholder="추가할 팀 항목 이름 (예: 특별 게임)">
            <button class="btn" id="addCategoryBtn">팀 항목 추가</button>
        </div>
        
        <div class="main-score-grid">
            <div class="main-score-card">
                <div class="main-score-title">🏷️ Journey (J) 팀 점수표</div>
                <div class="table-responsive">
                    <table id="scoreTableJ" class="main-score-table">
                        <thead>
                            <tr>
                                <th style="width:22%">항목명</th>
                                <th class="team-red">레드 J</th>
                                <th class="team-blue">블루 J</th>
                                <th class="team-green">그린 J</th>
                            </tr>
                        </thead>
                        <tbody id="tableBodyJ"></tbody>
                        <tfoot>
                            <tr class="total-row">
                                <td>총점</td>
                                <td id="redJTotal" class="team-red">0</td>
                                <td id="blueJTotal" class="team-blue">0</td>
                                <td id="greenJTotal" class="team-green">0</td>
                            </tr>
                            <tr class="team-reset-row">
                                <td>팀 초기화</td>
                                <td><button class="col-reset-btn" data-team-reset="redJ">0점 초기화</button></td>
                                <td><button class="col-reset-btn" data-team-reset="blueJ">0점 초기화</button></td>
                                <td><button class="col-reset-btn" data-team-reset="greenJ">0점 초기화</button></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>

            <div class="main-score-card">
                <div class="main-score-title">🏷️ Trek (T) 팀 점수표</div>
                <div class="table-responsive">
                    <table id="scoreTableT" class="main-score-table">
                        <thead>
                            <tr>
                                <th style="width:22%">항목명</th>
                                <th class="team-red">레드 T</th>
                                <th class="team-blue">블루 T</th>
                                <th class="team-green">그린 T</th>
                            </tr>
                        </thead>
                        <tbody id="tableBodyT"></tbody>
                        <tfoot>
                            <tr class="total-row">
                                <td>총점</td>
                                <td id="redTTotal" class="team-red">0</td>
                                <td id="blueTTotal" class="team-blue">0</td>
                                <td id="greenTTotal" class="team-green">0</td>
                            </tr>
                            <tr class="team-reset-row">
                                <td>팀 초기화</td>
                                <td><button class="col-reset-btn" data-team-reset="redT">0점 초기화</button></td>
                                <td><button class="col-reset-btn" data-team-reset="blueT">0점 초기화</button></td>
                                <td><button class="col-reset-btn" data-team-reset="greenT">0점 초기화</button></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>

        <div class="header-bottom">
            <h3>👤 팀별 인터렉션 기록 (레드/블루/그린)</h3>
            <button class="btn btn-gold" id="settleBtn">🏆 정산하여 위로 올리기</button>
        </div>

        <table id="indTable">
            <thead>
                <tr>
                    <th style="width:30%">팀명</th>
                    <th class="ind-header" style="width:70%">인터렉션 점수</th>
                </tr>
            </thead>
            <tbody id="indBody"></tbody>
        </table>
    </main>

    <main id="historyView" class="page hidden">
        <div class="history-topbar">
            <h2>🗂️ 이전 게임 전체 기록</h2>
            <div class="toolbar-actions">
                <button class="btn btn-muted" id="historyBackBtn">← 점수판으로</button>
                <button class="btn btn-muted" id="backupBtn">💾 기록 백업</button>
                <button class="btn btn-muted" id="restoreBtn">📥 백업 복원</button>
                <input type="file" id="restoreFileInput" accept=".json,application/json" hidden>
            </div>
        </div>
        
        <div class="history-toolbar">
            <div class="selection-info" id="selectionInfo">선택된 기록 0개</div>
            <button class="btn" id="toggleSelectAllBtn">전체 선택</button>
            <button class="btn btn-gold" id="selectedPdfBtn">🖼️ 선택 기록 개별 JPG 저장</button>
            <button class="btn btn-muted" id="allPdfBtn">🖼️ 전체 기록 한 장 JPG 저장</button>
            <button class="btn btn-danger-soft" id="clearHistoryBtn">전체 기록 삭제</button>
        </div>

        <div id="historyList"></div>
    </main>

    <main id="printView" class="hidden">
        <div class="print-toolbar">
            <strong>🖼️ 게임 기록 JPG 저장 미리보기</strong>
            <div class="toolbar-actions">
                <button class="btn btn-muted" id="printHistoryBtn">← 이전 기록</button>
                <button class="btn btn-gold" id="printNowBtn">JPG 저장</button>
            </div>
        </div>
        <div class="print-pages" id="printPages"></div>
    </main>

    <script>
        'use strict';

        const APP = {
            version: 2,
            keys: {
                current: 'dongju.scoreboard.current.v2',
                interaction: 'dongju.scoreboard.interaction.v2',
                history: 'dongju.scoreboard.history.v2'
            },
            legacyKeys: {
                current: 'teamScoreData_v4',
                interaction: 'bottomInteractionData_v4',
                history: 'teamScoreGameHistory_v1'
            },
            historyLimit: 50
        };

        const defaultCategories = ['출석', '단복착용', '핸드북', '암송', '성경읽기', '인터렉션', '추가점수'];
        const teamNames = ['redJ', 'blueJ', 'greenJ', 'redT', 'blueT', 'greenT'];

        const teamMeta = {
            redJ:   { label: '레드 J', colorClass: 'team-red', shortColor: 'red' },
            blueJ:  { label: '블루 J', colorClass: 'team-blue', shortColor: 'blue' },
            greenJ: { label: '그린 J', colorClass: 'team-green', shortColor: 'green' },
            redT:   { label: '레드 T', colorClass: 'team-red', shortColor: 'red' },
            blueT:  { label: '블루 T', colorClass: 'team-blue', shortColor: 'blue' },
            greenT: { label: '그린 T', colorClass: 'team-green', shortColor: 'green' }
        };

        const scoreGroups = [
            { key: 'J', title: 'Journey (J) 팀', teams: ['redJ', 'blueJ', 'greenJ'] },
            { key: 'T', title: 'Trek (T) 팀', teams: ['redT', 'blueT', 'greenT'] }
        ];

        let selectedHistoryIds = new Set();

        function safeParse(value, fallback) {
            if (!value) return fallback;
            try {
                return JSON.parse(value);
            } catch {
                return fallback;
            }
        }

        function migrateLegacyStorage() {
            const mappings = [
                [APP.keys.current, APP.legacyKeys.current],
                [APP.keys.interaction, APP.legacyKeys.interaction],
                [APP.keys.history, APP.legacyKeys.history]
            ];

            mappings.forEach(([nextKey, oldKey]) => {
                if (localStorage.getItem(nextKey) === null) {
                    const legacy = localStorage.getItem(oldKey);
                    if (legacy !== null) {
                        localStorage.setItem(nextKey, legacy);
                    }
                }
            });
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function makeEmptyScores() {
            return Object.fromEntries(teamNames.map(team => [team, 0]));
        }

        function getCurrentData() {
            const stored = safeParse(localStorage.getItem(APP.keys.current), null);

            if (Array.isArray(stored) && stored.length) {
                return stored.map(item => ({
                    name: String(item.name ?? ''),
                    isDefault: item.isDefault !== undefined
                        ? Boolean(item.isDefault)
                        : defaultCategories.includes(String(item.name ?? '')),
                    scores: Object.fromEntries(
                        teamNames.map(team => [team, Math.max(0, Number(item.scores?.[team] || 0))])
                    )
                }));
            }

            return defaultCategories.map(name => ({
                name,
                isDefault: true,
                scores: makeEmptyScores()
            }));
        }

        function setCurrentData(data) {
            localStorage.setItem(APP.keys.current, JSON.stringify(data));
        }

        function getInteractionData() {
            const saved = safeParse(localStorage.getItem(APP.keys.interaction), {});
            return {
                red: Math.max(0, Number(saved.red || 0)),
                blue: Math.max(0, Number(saved.blue || 0)),
                green: Math.max(0, Number(saved.green || 0))
            };
        }

        function setInteractionData(data) {
            localStorage.setItem(APP.keys.interaction, JSON.stringify(data));
        }

        function getHistory() {
            const history = safeParse(localStorage.getItem(APP.keys.history), []);
            return Array.isArray(history) ? history : [];
        }

        function setHistory(history) {
            localStorage.setItem(APP.keys.history, JSON.stringify(history.slice(0, APP.historyLimit)));
        }

        function formatDate(value) {
            const date = value ? new Date(value) : new Date();
            if (Number.isNaN(date.getTime())) return String(value || '');
            return date.toLocaleString('ko-KR');
        }
        
        function formatDateOnly(value) {
            const date = value ? new Date(value) : new Date();

            if (Number.isNaN(date.getTime())) {
                return String(value || '');
            }

            const yy = String(date.getFullYear()).slice(-2);
            const mm = date.getMonth() + 1;
            const dd = date.getDate();

            return `${yy}. ${mm}. ${dd}`;
        }


        function makeRecordId() {
            if (crypto && typeof crypto.randomUUID === 'function') {
                return crypto.randomUUID();
            }
            return `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
        }

        function calculateTotals(teamData) {
            const totals = makeEmptyScores();
            (teamData || []).forEach(item => {
                teamNames.forEach(team => {
                    totals[team] += Math.max(0, Number(item.scores?.[team] || 0));
                });
            });
            return totals;
        }

        function getGroupPlacements(totals, suffix) {
            const group = teamNames
                .filter(team => team.endsWith(suffix))
                .map(team => ({ team, score: Number(totals[team] || 0) }))
                .sort((a, b) => b.score - a.score);

            const uniqueScores = [...new Set(group.map(item => item.score))].sort((a, b) => b - a);

            if (!uniqueScores.length || uniqueScores[0] <= 0) {
                return { winners: [], runners: [] };
            }

            const winnerScore = uniqueScores[0];
            const runnerScore = uniqueScores.length > 1 ? uniqueScores[1] : null;

            return {
                winners: group.filter(item => item.score === winnerScore).map(item => item.team),
                runners: runnerScore === null
                    ? []
                    : group.filter(item => item.score === runnerScore).map(item => item.team)
            };
        }

        function getRankMap(record) {
            const totals = calculateTotals(record.teamData || []);
            const j = getGroupPlacements(totals, 'J');
            const t = getGroupPlacements(totals, 'T');
            const result = Object.fromEntries(teamNames.map(team => [team, '']));

            [...j.winners, ...t.winners].forEach(team => result[team] = '🥇');
            [...j.runners, ...t.runners].forEach(team => result[team] = '🥈');

            return result;
        }

        function createMainScoreRow(item, rowIndex, teams) {
            const tr = document.createElement('tr');
            tr.dataset.rowIndex = String(rowIndex);

            const nameTd = document.createElement('td');
            const wrap = document.createElement('div');
            wrap.className = 'category-cell';

            const nameSpan = document.createElement('span');
            nameSpan.className = 'category-name';
            nameSpan.textContent = item.name;
            wrap.appendChild(nameSpan);

            if (!item.isDefault) {
                const del = document.createElement('button');
                del.className = 'delete-btn';
                del.type = 'button';
                del.textContent = '삭제';
                del.addEventListener('click', () => deleteCategory(rowIndex));
                wrap.appendChild(del);
            }

            nameTd.appendChild(wrap);
            tr.appendChild(nameTd);

            teams.forEach(team => {
                const td = document.createElement('td');
                const control = document.createElement('div');
                control.className = 'score-control';

                const down = document.createElement('button');
                down.className = 'arrow-btn';
                down.type = 'button';
                down.textContent = '▼';
                down.addEventListener('click', () => changeScore(rowIndex, team, -100));

                const value = document.createElement('span');
                value.className = 'score-val';
                value.textContent = String(item.scores[team]);

                const up = document.createElement('button');
                up.className = 'arrow-btn';
                up.type = 'button';
                up.textContent = '▲';
                up.addEventListener('click', () => changeScore(rowIndex, team, 100));

                control.append(down, value, up);
                td.appendChild(control);
                tr.appendChild(td);
            });

            return tr;
        }

        function renderMain() {
            const data = getCurrentData();
            const tbodyJ = document.getElementById('tableBodyJ');
            const tbodyT = document.getElementById('tableBodyT');
            tbodyJ.innerHTML = '';
            tbodyT.innerHTML = '';

            const jTeams = ['redJ', 'blueJ', 'greenJ'];
            const tTeams = ['redT', 'blueT', 'greenT'];

            data.forEach((item, rowIndex) => {
                tbodyJ.appendChild(createMainScoreRow(item, rowIndex, jTeams));
                tbodyT.appendChild(createMainScoreRow(item, rowIndex, tTeams));
            });

            renderTotals(data);
            renderInteraction();
        }

        function renderTotals(data = getCurrentData()) {
            const totals = calculateTotals(data);
            teamNames.forEach(team => {
                const target = document.getElementById(`${team}Total`);
                if (target) target.textContent = String(totals[team]);
            });
        }

        function changeScore(rowIndex, team, delta) {
            const data = getCurrentData();
            if (!data[rowIndex]) return;

            data[rowIndex].scores[team] = Math.max(
                0,
                Number(data[rowIndex].scores[team] || 0) + delta
            );

            setCurrentData(data);
            renderMain();
        }

        function addCategory() {
            const input = document.getElementById('categoryInput');
            const name = input.value.trim();

            if (!name) {
                alert('항목 이름을 입력해주세요.');
                return;
            }

            const data = getCurrentData();
            data.push({
                name,
                isDefault: false,
                scores: makeEmptyScores()
            });

            setCurrentData(data);
            input.value = '';
            renderMain();
        }

        function deleteCategory(rowIndex) {
            if (!confirm('이 항목을 삭제하시겠습니까?')) return;

            const data = getCurrentData();
            if (!data[rowIndex] || data[rowIndex].isDefault) return;

            data.splice(rowIndex, 1);
            setCurrentData(data);
            renderMain();
        }

        function resetTeamScore(team) {
            if (!confirm('해당 팀의 모든 점수를 0점으로 초기화하시겠습니까?')) return;

            const data = getCurrentData();
            data.forEach(item => item.scores[team] = 0);
            setCurrentData(data);
            renderMain();
        }

        function renderInteraction() {
            const scores = getInteractionData();
            const tbody = document.getElementById('indBody');
            tbody.innerHTML = '';

            const teams = [
                { id: 'red', label: 'Red (통합)', className: 'team-red' },
                { id: 'blue', label: 'Blue (통합)', className: 'team-blue' },
                { id: 'green', label: 'Green (통합)', className: 'team-green' }
            ];

            teams.forEach(team => {
                const tr = document.createElement('tr');

                const nameTd = document.createElement('td');
                const label = document.createElement('span');
                label.className = team.className;
                label.textContent = team.label;
                nameTd.appendChild(label);

                const scoreTd = document.createElement('td');
                const control = document.createElement('div');
                control.className = 'score-control';

                const down = document.createElement('button');
                down.className = 'arrow-btn';
                down.type = 'button';
                down.textContent = '▼';
                down.addEventListener('click', () => changeInteraction(team.id, -100));

                const value = document.createElement('span');
                value.className = 'score-val';
                value.textContent = String(scores[team.id]);

                const up = document.createElement('button');
                up.className = 'arrow-btn';
                up.type = 'button';
                up.textContent = '▲';
                up.addEventListener('click', () => changeInteraction(team.id, 100));

                control.append(down, value, up);
                scoreTd.appendChild(control);

                tr.append(nameTd, scoreTd);
                tbody.appendChild(tr);
            });
        }

        function changeInteraction(team, delta) {
            const data = getInteractionData();
            data[team] = Math.max(0, Number(data[team] || 0) + delta);
            setInteractionData(data);
            renderInteraction();
        }

        function settleInteraction() {
            const bottom = getInteractionData();
            const ranking = [
                { color: 'red', score: bottom.red },
                { color: 'blue', score: bottom.blue },
                { color: 'green', score: bottom.green }
            ].sort((a, b) => b.score - a.score);

            const distinct = [...new Set(ranking.map(item => item.score))].sort((a, b) => b - a);
            const rewardByRank = [1000, 600, 200];

            ranking.forEach(item => {
                const rankIndex = distinct.indexOf(item.score);
                item.reward = rewardByRank[Math.min(rankIndex, rewardByRank.length - 1)];
            });

            const data = getCurrentData();
            const interactionRow = data.find(item => item.name === '인터렉션');

            if (!interactionRow) {
                alert("상단 표에서 '인터렉션' 항목을 찾을 수 없습니다.");
                return;
            }

            ranking.forEach(item => {
                interactionRow.scores[`${item.color}J`] = item.reward;
                interactionRow.scores[`${item.color}T`] = item.reward;
            });

            setCurrentData(data);
            renderMain();
        }

        function saveCurrentGameToHistory() {
            const teamData = getCurrentData();
            const record = {
                id: makeRecordId(),
                savedAt: new Date().toISOString(),
                teamData,
                bottomData: getInteractionData(),
                totals: calculateTotals(teamData)
            };

            const history = getHistory();
            history.unshift(record);
            setHistory(history);
            return record;
        }

        function resetToNewGame() {
            const blank = defaultCategories.map(name => ({
                name,
                isDefault: true,
                scores: makeEmptyScores()
            }));

            setCurrentData(blank);
            setInteractionData({ red: 0, blue: 0, green: 0 });
            renderMain();
        }

        function startNewGame() {
            const ok = confirm(
                "현재 기록을 '이전 게임 기록'에 저장한 뒤 새 게임을 시작할까요?\n\n"
            );

            if (!ok) return;

            saveCurrentGameToHistory();
            resetToNewGame();
            alert('현재 기록을 저장하고 새 게임을 시작했습니다.');
        }

        function buildGroupRankStrip(record, groupKey) {
            const totals = calculateTotals(record.teamData || []);
            const placements = getGroupPlacements(totals, groupKey);
            const group = scoreGroups.find(item => item.key === groupKey);
            const rankMap = {};

            group.teams.forEach(team => rankMap[team] = '');
            placements.winners.forEach(team => rankMap[team] = '🥇');
            placements.runners.forEach(team => rankMap[team] = '🥈');

            return `
                <div class="group-rank-strip">
                    <div class="group-rank-strip-spacer"></div>
                    ${group.teams.map(team => `
                        <div class="group-rank-strip-cell">
                            <span class="group-rank-icon ${rankMap[team] ? '' : 'empty'}">
                                ${rankMap[team] || '•'}
                            </span>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function buildGroupScoreReport(record, group) {
            const totals = calculateTotals(record.teamData || []);

            const rows = (record.teamData || []).map(item => `
                <tr>
                    <td>${escapeHtml(item.name)}</td>
                    ${group.teams.map(team => `
                        <td class="${teamMeta[team].colorClass}">
                            ${Math.max(0, Number(item.scores?.[team] || 0))}
                        </td>
                    `).join('')}
                </tr>
            `).join('');

            const finalCells = group.teams.map(team => `
                <td class="${teamMeta[team].colorClass} bg-warning bg-opacity-10">
                    <span class="final-score-chip d-inline-flex align-items-center justify-content-center
                                 fw-bolder rounded-3 border shadow-sm px-3 py-2">
                        ${Math.max(0, Number(totals[team] || 0))}
                    </span>
                </td>
            `).join('');

            return `
                <div class="record-group-card">
                    <div class="record-group-title">🏷️ ${group.title}</div>
                    <div class="group-report-wrap">
                        ${buildGroupRankStrip(record, group.key)}
                        <table class="group-score-table">
                            <thead>
                                <tr>
                                    <th>항목명</th>
                                    ${group.teams.map(team => `
                                        <th>
                                            <span class="team-name ${teamMeta[team].colorClass}">
                                                ${teamMeta[team].label}
                                            </span>
                                        </th>
                                    `).join('')}
                                </tr>
                            </thead>
                            <tbody>
                                ${rows}
                                <tr class="final-score-row align-middle border-top border-bottom border-warning border-4">
                                    <td class="bg-warning bg-opacity-10">
                                        <strong class="final-score-label">최종점수</strong>
                                    </td>
                                    ${finalCells}
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function buildSeparatedScoreReport(record) {
            return `
                <div class="record-group-grid">
                    ${scoreGroups.map(group => buildGroupScoreReport(record, group)).join('')}
                </div>
            `;
        }

        function renderHistory() {
            const history = getHistory();
            const list = document.getElementById('historyList');

            selectedHistoryIds = new Set(
                [...selectedHistoryIds].filter(id => history.some(record => record.id === id))
            );

            if (!history.length) {
                list.innerHTML = `
                    <div class="empty-history">
                        아직 저장된 이전 게임 기록이 없습니다.<br>
                        메인 점수판에서 ‘전체 초기화’을 누르면 현재 판을 저장하고 새 판을 시작합니다.
                    </div>
                `;
                updateHistorySelectionInfo();
                return;
            }

            list.innerHTML = history.map(record => `
                <section class="history-card ${selectedHistoryIds.has(record.id) ? 'selected' : ''}" data-history-id="${escapeHtml(record.id)}">
                    <div class="history-card-head">
                        <label class="history-check-label">
                            <input type="checkbox" class="history-check" value="${escapeHtml(record.id)}" ${selectedHistoryIds.has(record.id) ? 'checked' : ''}>
                            <span>📌 ${escapeHtml(formatDateOnly(record.savedAt))}</span>
                        </label>
                        <button class="btn btn-danger-soft delete-history-btn" data-delete-id="${escapeHtml(record.id)}">삭제</button>
                    </div>
                    <div class="history-card-body">
                        <div class="section-label">📋 항목별 상세 점수</div>
                        <div class="table-responsive">
                            ${buildSeparatedScoreReport(record)}
                        </div>
                    </div>
                </section>
            `).join('');

            list.querySelectorAll('.history-check').forEach(input => {
                input.addEventListener('change', () => {
                    if (input.checked) selectedHistoryIds.add(input.value);
                    else selectedHistoryIds.delete(input.value);
                    renderHistory();
                });
            });

            list.querySelectorAll('.delete-history-btn').forEach(button => {
                button.addEventListener('click', () => deleteHistoryRecord(button.dataset.deleteId));
            });

            updateHistorySelectionInfo();
        }

        function updateHistorySelectionInfo() {
            document.getElementById('selectionInfo').textContent =
                `선택된 기록 ${selectedHistoryIds.size}개`;

            const total = getHistory().length;
            document.getElementById('toggleSelectAllBtn').textContent =
                total > 0 && selectedHistoryIds.size === total ? '전체 선택 해제' : '전체 선택';
        }

        function toggleSelectAllHistory() {
            const history = getHistory();

            if (history.length && selectedHistoryIds.size === history.length) {
                selectedHistoryIds.clear();
            } else {
                selectedHistoryIds = new Set(history.map(record => record.id));
            }

            renderHistory();
        }

        function deleteHistoryRecord(id) {
            if (!confirm('이 저장 기록을 삭제하시겠습니까?')) return;

            const next = getHistory().filter(record => record.id !== id);
            setHistory(next);
            selectedHistoryIds.delete(id);
            renderHistory();
        }

        function clearHistory() {
            if (!getHistory().length) return;
            if (!confirm('저장된 이전 게임 기록을 모두 삭제하시겠습니까?')) return;

            setHistory([]);
            selectedHistoryIds.clear();
            renderHistory();
        }

        function baseUrl() {
            return window.location.href.split('#')[0];
        }

        function openHistoryTab() {
            window.location.hash = 'history';
        }

        function openPrintTab(ids, saveMode = 'single') {
            if (!ids.length) {
                alert('JPG로 저장할 기록을 하나 이상 선택해주세요.');
                return;
            }

            const encodedIds = ids.map(id => encodeURIComponent(id)).join(',');
            window.location.hash = `save=${encodedIds}&autodownload=1&mode=${saveMode}`;
        }

        function getDateStampYYMMDD(value) {
            const date = value ? new Date(value) : new Date();
            if (Number.isNaN(date.getTime())) return getTodayYYMMDD();

            const yy = String(date.getFullYear()).slice(-2);
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            return `${yy}${mm}${dd}`;
        }

        async function downloadRecordAsJpg(recordElement, fileName) {
            if (typeof html2canvas !== 'function') {
                alert('JPG 저장 라이브러리를 불러오지 못했습니다. 새로고침 후 다시 시도해주세요.');
                return;
            }

            const canvas = await html2canvas(recordElement, {
                backgroundColor: '#121212',
                scale: 2,
                useCORS: true
            });

            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/jpeg', 0.95);
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            link.remove();
        }

        async function downloadVisibleRecordsAsJpg() {
            const records = [...document.querySelectorAll('#printPages .print-record')];

            if (!records.length) {
                alert('저장할 기록이 없습니다.');
                return;
            }

            for (let i = 0; i < records.length; i += 1) {
                const recordElement = records[i];
                const stamp = recordElement.dataset.savedDate || getTodayYYMMDD();
                const fileName = `게임기록_${stamp}_${String(i + 1).padStart(2, '0')}.jpg`;
                await downloadRecordAsJpg(recordElement, fileName);
                await new Promise(resolve => setTimeout(resolve, 250));
            }
        }

        async function downloadCombinedRecordsAsJpg() {
            const pages = document.getElementById('printPages');

            if (!pages || !pages.children.length) {
                alert('저장할 기록이 없습니다.');
                return;
            }

            const fileName = `게임기록_전체_${getTodayYYMMDD()}.jpg`;
            await downloadRecordAsJpg(pages, fileName);
        }

        function renderPrint(ids, autoDownload, saveMode = 'single') {
            const history = getHistory();
            const order = new Map(ids.map((id, index) => [id, index]));
            const records = history
                .filter(record => order.has(record.id))
                .sort((a, b) => order.get(a.id) - order.get(b.id));

            const pages = document.getElementById('printPages');
            pages.dataset.saveMode = saveMode;

            const saveButton = document.getElementById('printNowBtn');
            if (saveButton) {
                saveButton.textContent = saveMode === 'combined' ? 'JPG 한 장 저장' : 'JPG 개별 저장';
            }

            if (!records.length) {
                pages.innerHTML = `
                    <div class="print-empty">
                        JPG로 저장할 기록을 찾을 수 없습니다.<br>
                        이전 기록 화면에서 다시 선택해주세요.
                    </div>
                `;
                return;
            }

            pages.innerHTML = records.map(record => `
                <section class="print-record" data-saved-date="${escapeHtml(getDateStampYYMMDD(record.savedAt))}">
                    <div class="print-date">📌날짜: ${escapeHtml(formatDateOnly(record.savedAt))}</div>
                    <div class="section-label">📋 Journey / Trek 팀별 상세 점수</div>
                    ${buildSeparatedScoreReport(record)}
                </section>
            `).join('');

            if (autoDownload) {
                const cleanHash = `#save=${ids.map(id => encodeURIComponent(id)).join(',')}&mode=${saveMode}`;
                window.history.replaceState(null, '', `${baseUrl()}${cleanHash}`);
                setTimeout(() => {
                    if (saveMode === 'combined') {
                        downloadCombinedRecordsAsJpg();
                    } else {
                        downloadVisibleRecordsAsJpg();
                    }
                }, 250);
            }
        }

        function parseRoute() {
            const raw = window.location.hash.slice(1);

            if (raw === 'history') {
                return { mode: 'history' };
            }

            if (raw.startsWith('save=')) {
                const query = new URLSearchParams(raw.replace(/^save=/, 'ids='));
                const ids = (query.get('ids') || '')
                    .split(',')
                    .filter(Boolean)
                    .map(value => decodeURIComponent(value));

                return {
                    mode: 'print',
                    ids,
                    autoPrint: query.get('autodownload') === '1',
                    saveMode: query.get('mode') || 'single'
                };
            }

            return { mode: 'main' };
        }

        function showRoute() {
            const route = parseRoute();
            const mainView = document.getElementById('mainView');
            const historyView = document.getElementById('historyView');
            const printView = document.getElementById('printView');

            mainView.classList.toggle('hidden', route.mode !== 'main');
            historyView.classList.toggle('hidden', route.mode !== 'history');
            printView.classList.toggle('hidden', route.mode !== 'print');

            if (route.mode === 'main') {
                document.title = '팀별 점수 기록표';
                renderMain();
            } else if (route.mode === 'history') {
                document.title = '이전 게임 전체 기록';
                renderHistory();
            } else {
                document.title = `게임기록_${getTodayYYMMDD()}_JPG`;
                renderPrint(route.ids, route.autoPrint, route.saveMode || 'single');
            }
        }
        
        function getTodayYYMMDD() {
            const now = new Date();
        
            const yy = String(now.getFullYear()).slice(-2);
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
        
            return `${yy}${mm}${dd}`;
        }
        
        function exportBackup() {
            const payload = {
                app: 'dongju-scoreboard',
                schemaVersion: APP.version,
                exportedAt: new Date().toISOString(),
                current: getCurrentData(),
                interaction: getInteractionData(),
                history: getHistory()
            };

            const blob = new Blob(
                [JSON.stringify(payload, null, 2)],
                { type: 'application/json;charset=utf-8' }
            );

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const stamp = new Date().toISOString().slice(0, 10);
            a.href = url;
            a.download = `team-scoreboard-backup-${stamp}.json`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        async function importBackup(file) {
            if (!file) return;

            let payload;
            try {
                payload = JSON.parse(await file.text());
            } catch {
                alert('올바른 JSON 백업 파일이 아닙니다.');
                return;
            }

            if (!payload || payload.app !== 'dongju-scoreboard' || !Array.isArray(payload.history)) {
                alert('이 점수판에서 만든 백업 파일이 아닙니다.');
                return;
            }

            if (!confirm('현재 점수판과 이전 기록을 백업 파일 내용으로 교체하시겠습니까?')) {
                return;
            }

            if (Array.isArray(payload.current)) {
                setCurrentData(payload.current);
            }

            if (payload.interaction && typeof payload.interaction === 'object') {
                setInteractionData(payload.interaction);
            }

            setHistory(payload.history);

            alert('백업을 복원했습니다.');
            selectedHistoryIds.clear();
            showRoute();
        }

        function bindEvents() {
            document.getElementById('addCategoryBtn').addEventListener('click', addCategory);
            document.getElementById('categoryInput').addEventListener('keydown', event => {
                if (event.key === 'Enter') addCategory();
            });

            document.querySelectorAll('[data-team-reset]').forEach(button => {
                button.addEventListener('click', () => resetTeamScore(button.dataset.teamReset));
            });

            document.getElementById('settleBtn').addEventListener('click', settleInteraction);
            document.getElementById('newGameBtn').addEventListener('click', startNewGame);
            document.getElementById('openHistoryBtn').addEventListener('click', openHistoryTab);

            document.getElementById('backupBtn').addEventListener('click', exportBackup);

            const restoreInput = document.getElementById('restoreFileInput');
            document.getElementById('restoreBtn').addEventListener('click', () => restoreInput.click());
            restoreInput.addEventListener('change', async () => {
                await importBackup(restoreInput.files?.[0]);
                restoreInput.value = '';
            });

            document.getElementById('historyBackBtn').addEventListener('click', () => {
                window.location.hash = '';
            });

            document.getElementById('toggleSelectAllBtn').addEventListener('click', toggleSelectAllHistory);

            document.getElementById('selectedPdfBtn').addEventListener('click', () => {
                openPrintTab([...selectedHistoryIds], 'single');
            });

            document.getElementById('allPdfBtn').addEventListener('click', () => {
                openPrintTab(getHistory().map(record => record.id), 'combined');
            });

            document.getElementById('clearHistoryBtn').addEventListener('click', clearHistory);

            document.getElementById('printNowBtn').addEventListener('click', () => {
                const mode = document.getElementById('printPages').dataset.saveMode || 'single';
                if (mode === 'combined') {
                    downloadCombinedRecordsAsJpg();
                } else {
                    downloadVisibleRecordsAsJpg();
                }
            });
            document.getElementById('printHistoryBtn').addEventListener('click', () => {
                window.location.hash = 'history';
            });

            window.addEventListener('hashchange', showRoute);

            window.addEventListener('storage', event => {
                if ([APP.keys.current, APP.keys.interaction, APP.keys.history].includes(event.key)) {
                    showRoute();
                }
            });
        }

        function init() {
            migrateLegacyStorage();

            if (localStorage.getItem(APP.keys.current) === null) {
                setCurrentData(defaultCategories.map(name => ({
                    name,
                    isDefault: true,
                    scores: makeEmptyScores()
                })));
            }

            if (localStorage.getItem(APP.keys.interaction) === null) {
                setInteractionData({ red: 0, blue: 0, green: 0 });
            }

            if (localStorage.getItem(APP.keys.history) === null) {
                setHistory([]);
            }

            bindEvents();
            showRoute();
        }

        init();
    </script>
</body>
</html>
